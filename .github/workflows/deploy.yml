name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/tenacitos

jobs:
  # ── Lint + type-check ───────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  # ── Build Docker image ──────────────────────────────────────────────────────
  build:
    name: Build image
    runs-on: ubuntu-24.04-arm
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      changed: ${{ steps.changes.outputs.app }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect application changes
        id: changes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" HEAD -- . ':(exclude)**/*.md'; then
            echo "app=false" >> "$GITHUB_OUTPUT"
          else
            echo "app=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.changes.outputs.app == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Restore Next.js build cache
        if: steps.changes.outputs.app == 'true'
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/**/*.js', 'src/**/*.jsx', 'src/**/*.ts', 'src/**/*.tsx', '*.mjs') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - if: steps.changes.outputs.app == 'true'
        run: npm ci
      - if: steps.changes.outputs.app == 'true'
        run: npm run build

      - if: steps.changes.outputs.app == 'true'
        uses: docker/setup-buildx-action@v4

      - if: steps.changes.outputs.app == 'true' && github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.changes.outputs.app == 'true' && github.event_name == 'push'
        name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - if: steps.changes.outputs.app == 'true' && github.event_name == 'pull_request'
        name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.runtime
          platforms: linux/arm64
          push: false
          tags: tenacitos:test

      - if: steps.changes.outputs.app == 'true' && github.event_name == 'push'
        name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.runtime
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ── Deploy to spot instance ─────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [lint, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner && needs.build.outputs.changed == 'true'
    environment: production
    steps:
      - name: Deploy to openclaw.neuralops.ca
        uses: appleboy/ssh-action@v1
        with:
          host: openclaw.neuralops.ca
          port: 2022
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            echo "Pulling ghcr.io/progerjkd/tenacitos:latest..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u progerjkd --password-stdin
            docker pull ghcr.io/progerjkd/tenacitos:latest
            docker compose -f /opt/openclaw/docker-compose.yml up -d --no-deps tenacitos
            echo "Deploy complete — $(date)"
